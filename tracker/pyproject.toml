[project]
name = "voetbal-tracker"
version = "0.1.0"
description = "Real-time UWB ball tracking HUD for a football pitch"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dearpygui>=1.11",
    "numpy>=1.26",
    "pyserial>=3.5",
]

[project.scripts]
uwb-tracker = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
