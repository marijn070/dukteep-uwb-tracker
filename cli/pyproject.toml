[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["."]

[project]
name = "uwb-cli"
version = "0.1.0"
description = "UWB football tracking system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.6",
    "pydantic>=2.13.4",
    "pyserial>=3.5",
    "rich>=15.0.0",
    "tomli-w>=1.2.0",
    "typer>=0.26.7",
]

[project.scripts]
uwb = "uwb_cli:main"
chipconfig = "chipconfig:app"
distances = "distances:run_main"
calibrate = "calibration:main"
